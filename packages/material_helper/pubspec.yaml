name: material_helper
description: A helper package for other Material Apps.
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: ">=3.35.5"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.8.0
  flutter_localizations:
    sdk: flutter
  material_graphics: any
  intl: any
  path_provider: ^2.1.5
  http: ^1.5.0
  sqlite3: ^3.7.0
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.2
  pretty_qr_code: ^3.6.0
  flutter_svg: ^2.2.4
  dynamic_color: ^2.1.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  generate: true
  assets:
    - assets/apps/
